<title>Transccema — Assinar Fechamento</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#111827;min-height:100vh;display:flex;flex-direction:column}
.topo{background:linear-gradient(125deg,#060f2e 0%,#0d2d6e 50%,#1752a8 100%);
  padding:14px 16px;display:flex;align-items:center;gap:10px}
.topo img{height:36px;border-radius:5px}
.topo-nome{font-size:14px;font-weight:700;color:#fff}
.topo-sub{font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em}
.wrap{max-width:480px;margin:0 auto;padding:16px;flex:1;width:100%}

/* Card assinatura */
.card{background:#fff;border-radius:14px;border:1px solid #d0d7ea;
  box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden;margin-bottom:14px}
.card-head{padding:12px 16px;background:#f3f5fb;border-bottom:1px solid #d0d7ea;
  font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em}
.card-body{padding:16px}
.hint{font-size:13px;color:#6b7280;text-align:center;line-height:1.6;margin-bottom:14px}
.motorista-nome{font-size:16px;font-weight:700;color:#111827;text-align:center;margin-bottom:4px}
.motorista-env{font-size:13px;color:#6b7280;text-align:center;margin-bottom:16px}

/* Canvas */
.canvas-wrap{border:2px dashed #d0d7ea;border-radius:12px;overflow:hidden;
  background:#f8f9ff;position:relative;margin-bottom:14px;transition:border-color .2s}
.canvas-wrap.signed{border-color:#86efac;border-style:solid;background:#f0fdf4}
canvas{display:block;width:100%;height:200px;cursor:crosshair;touch-action:none}
.canvas-ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;transition:opacity .2s}
.canvas-ph-ico{font-size:36px;display:block;margin-bottom:6px;opacity:.2}
.canvas-ph-txt{font-size:13px;color:#d0d7ea;font-weight:500}

/* Botões */
.btns{display:flex;gap:8px}
.btn{flex:1;padding:14px;border-radius:10px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-limpar{background:#f3f5fb;color:#374151;border:1px solid #d0d7ea}
.btn-confirmar{background:linear-gradient(135deg,#0d2d6e 0%,#1752a8 100%);
  color:#fff;box-shadow:0 4px 12px rgba(13,45,110,.3)}

/* Tela de sucesso */
.sucesso{display:none;text-align:center;padding:40px 20px}
.sucesso-ico{font-size:72px;margin-bottom:16px;display:block}
.sucesso-tit{font-size:24px;font-weight:800;color:#16a34a;margin-bottom:8px}
.sucesso-sub{font-size:15px;color:#6b7280;line-height:1.6}

/* Erro */
.erro{display:none;background:#fef2f2;border-radius:12px;padding:20px;
  text-align:center;border:1px solid #fca5a5;color:#dc2626;font-size:13px;margin-bottom:14px}
</style>
</head>

<div class="wrap">

  <div class="erro" id="erro">
    ⚠️ Link inválido. Solicite um novo link ao responsável.
  </div>

  <!-- Card de assinatura -->
  <div class="card" id="card-assn" style="display:none">
    <div class="card-head">✍ Assinatura do motorista</div>
    <div class="card-body">
      <div class="motorista-nome" id="d-mot">—</div>
      <div class="motorista-env" id="d-env">—</div>
      <p class="hint">Assine com o dedo para confirmar o recebimento do fechamento</p>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div class="canvas-ph" id="canvas-ph">
          <span class="canvas-ph-ico">✍</span>
          <span class="canvas-ph-txt">Assine aqui</span>
        </div>
      </div>
      <div class="btns">
        <button class="btn btn-limpar" onclick="limpar()">Limpar</button>
        <button class="btn btn-confirmar" onclick="confirmar()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Tela de sucesso (só para o motorista) -->
  <div class="sucesso" id="sucesso">
    <span class="sucesso-ico">✅</span>
    <div class="sucesso-tit">Aprovado!</div>
    <div class="sucesso-sub" id="sucesso-sub">Assinatura confirmada com sucesso.</div>
  </div>

</div>

<script>
const fmt = v => 'R$ ' + Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtD = v => { if(!v)return'—'; const p=String(v).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; };

// Ler dados da URL
let dados = null;
try {
  const hash = window.location.hash.slice(1);
  if(!hash) throw new Error('sem dados');
  // Decode correto para suportar acentos
    const bin   = atob(hash);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const json  = new TextDecoder().decode(bytes);
    dados = JSON.parse(json);
} catch(e) {
  document.getElementById('erro').style.display = 'block';
}

if(dados) {
  document.getElementById('card-assn').style.display = 'block';
  document.getElementById('d-mot').textContent = dados.motorista || '—';
  document.getElementById('d-env').textContent = 'Envelope ' + (dados.envelope||'—') + '  ·  ' + fmtD(dados.saida) + ' → ' + fmtD(dados.retorno);
}

// Canvas
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let desenhando = false, temDesenho = false;

function redim() {
  const rect = canvas.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  return { x: s.clientX - r.left, y: s.clientY - r.top };
}

function iniciar(e) {
  e.preventDefault(); desenhando = true;
  const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  document.getElementById('canvas-ph').style.opacity = '0';
}
function desenhar(e) {
  if(!desenhando) return; e.preventDefault();
  const p = getPos(e);
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0d2d6e';
  ctx.lineTo(p.x, p.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x, p.y);
  if(!temDesenho) {
    temDesenho = true;
    document.getElementById('canvas-wrap').classList.add('signed');
  }
}
function parar() { desenhando = false; }

canvas.addEventListener('mousedown',  iniciar,  {passive:false});
canvas.addEventListener('mousemove',  desenhar, {passive:false});
canvas.addEventListener('mouseup',    parar);
canvas.addEventListener('mouseleave', parar);
canvas.addEventListener('touchstart', iniciar,  {passive:false});
canvas.addEventListener('touchmove',  desenhar, {passive:false});
canvas.addEventListener('touchend',   parar);
window.addEventListener('resize', redim);
redim();

function limpar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  temDesenho = false;
  document.getElementById('canvas-ph').style.opacity = '1';
  document.getElementById('canvas-wrap').classList.remove('signed');
}

function confirmar() {
  if(!temDesenho) { alert('Por favor, assine antes de confirmar.'); return; }

  // Mostrar aprovado para o motorista imediatamente
  document.getElementById('card-assn').style.display = 'none';
  document.getElementById('sucesso').style.display   = 'block';
  document.getElementById('sucesso-sub').textContent =
    'Obrigado, ' + (dados.motorista||'').split(' ')[0] + '!';
  window.scrollTo({top:0, behavior:'smooth'});

  // Enviar email para Felipe em background (motorista não vê isso)
  try {
    const dtBR = new Date().toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo'});
    emailjs.init('m7evVV_nw-qO8ejln');
    // Reduzir assinatura para tamanho pequeno
    const off = document.createElement('canvas');
    off.width = 300; off.height = 100;
    const offCtx = off.getContext('2d');
    offCtx.fillStyle = '#ffffff';
    offCtx.fillRect(0, 0, 300, 100);
    offCtx.drawImage(canvas, 0, 0, 300, 100);
    const imgB64 = off.toDataURL('image/png').split(',')[1];

    // Salvar imagem no GitHub (repositório público) via API
    const nomeArq = 'assinaturas/' + dados.envelope + '_' + Date.now() + '.png';
    const githubUrl = 'https://api.github.com/repos/FeeBordi/transccema-fechamentos/contents/' + nomeArq;

    console.log('Enviando para GitHub:', githubUrl);
    console.log('Tamanho imagem:', imgB64.length, 'chars');

    fetch(githubUrl, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'token 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'
      },
      body: JSON.stringify({
        message: 'Assinatura ' + dados.motorista + ' env ' + dados.envelope,
        content: imgB64
      })
    })
    .then(r => { console.log('GitHub status:', r.status); return r.json(); })
    .then(r => {
      console.log('GitHub resposta:', JSON.stringify(r).substring(0,200));
      const urlImagem = r.content && r.content.download_url
        ? r.content.download_url
        : (r.content
          ? 'https://raw.githubusercontent.com/FeeBordi/transccema-fechamentos/main/' + nomeArq
          : '');
      console.log('URL imagem:', urlImagem);
      return emailjs.send('service_ms29wao', 'template_ry3210s', {
        subject:     dados.motorista + ' — Env. ' + dados.envelope + ' — Fechamento assinado',
        motorista:   dados.motorista  || '—',
        envelope:    dados.envelope   || '—',
        saida:       fmtD(dados.saida),
        retorno:     fmtD(dados.retorno),
        diarias:     String(dados.diarias||0) + ' dias',
        nota_gobrax: String(dados.nota_gobrax||0) + ' pts',
        adiantamento:dados.adiantamento > 0 ? fmt(dados.adiantamento) : '—',
        despesas:    dados.despesas_str || '—',
        pagamento:   fmt(dados.pagamento_liquido||0),
        data_hora:   dtBR,
        assinatura_url: urlImagem,
        assinado:    'SIM — Assinado digitalmente pelo motorista'
      });
    })
    .catch(() => {
      // Se falhar o upload, envia email sem imagem mesmo
      return emailjs.send('service_ms29wao', 'template_ry3210s', {
        subject:     dados.motorista + ' — Env. ' + dados.envelope + ' — Fechamento assinado',
        motorista:   dados.motorista  || '—',
        envelope:    dados.envelope   || '—',
        saida:       fmtD(dados.saida),
        retorno:     fmtD(dados.retorno),
        diarias:     String(dados.diarias||0) + ' dias',
        nota_gobrax: String(dados.nota_gobrax||0) + ' pts',
        adiantamento:dados.adiantamento > 0 ? fmt(dados.adiantamento) : '—',
        despesas:    dados.despesas_str || '—',
        pagamento:   fmt(dados.pagamento_liquido||0),
        data_hora:   dtBR,
        assinatura_url: '',
        assinado:    'SIM — Assinado digitalmente pelo motorista'
      });
    })
    .then(r  => console.log('Email OK:', r.status))
    .catch(e => console.warn('Email erro:', e));
  } catch(e) { console.warn('Email:', e); }
}
</script>
</body>
</html>
